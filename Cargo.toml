[package]
name = "memo128"
version = "0.1.0"
edition = "2021"
description = "A library for encoding and decoding 128-bit data as mnemonic sentences"
authors = ["memo128 developers"]

[lib]
name = "memo128"
path = "src/lib.rs"

[[bin]]
name = "memo128"
path = "src/main.rs"

[dependencies]
sha2 = "0.10.9"
num-bigint = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
tempfile = "3.19.1"
